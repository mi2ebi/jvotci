[workspace]
members = ["jvotci-cli"]
default-members = [".", "jvotci-cli"]

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mi2ebi/jvotci"
rust-version = "1.89.0"

[workspace.dependencies]
jvotci = { path = ".", version = "3.0.0" }

[package]
name = "jvotci"
description = "Tools for creating and decomposing Lojban lujvo."
keywords = ["lojban", "lujvo", "linguistics", "morphology"]
categories = ["text-processing", "parser-implementations"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# fancy-regex = "0.18.0"
itertools = "0.15.0"
thiserror = "2.0.19"
